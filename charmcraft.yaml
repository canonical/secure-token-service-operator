name: secure-token-service
type: charm
title: Charmed Secure Token Service
summary: Session manager and token issuer for the Canonical centralized identity solution.
description: |
  Secure Token Service (STS) implements the Phantom Token Pattern for secure session management and internal JWT issuance.
  It acts as a Policy Enforcement Point (PEP) that sits between external clients and internal microservices.

links:
  documentation: https://canonical-identity.readthedocs-hosted.com
  source: https://github.com/canonical/secure-token-service-operator
  issues: https://github.com/canonical/secure-token-service-operator/issues

containers:
  secure-token-service:
    resource: oci-image
resources:
  oci-image:
    type: oci-image
    description: Secure Token Service oci-image
    upstream-source: ghcr.io/canonical/secure-token-service:v0.5.0

peers:
  peer:
    interface: secure-token-service-peer

provides:
  sts-info:
    interface: sts_info
  provide-cmr-mesh:
    interface: cross_model_mesh
    optional: true

requires:
  pg-database:
    interface: postgresql_client
    optional: false
  ingress:
    interface: istio_ingress_route
    limit: 1
    optional: false
  service-mesh:
    limit: 1
    interface: service_mesh
    optional: true
  require-cmr-mesh:
    interface: cross_model_mesh
    optional: true
  oauth:
    interface: oauth
    limit: 1
    description: |
      Receive oauth server's info and a set of client credentials.
      This integration can be used to integrate the service with an OAuth2/OIDC Provider.
    optional: false
  receive-ca-cert:
    interface: certificate_transfer
    limit: 1
    optional: false
  cache:
    interface: valkey_client
    limit: 1
    optional: false
    description: Integration with Valkey/Redis for session and token caching.

config:
  options:
    http_proxy:
      description: URL of the HTTP proxy eg http://proxy.internal:6666, it will set the HTTP_PROXY var in the workload environment
      type: string
      default: ''
    https_proxy:
      description: URL of the HTTPS proxy eg http://proxy.internal:6666, it will set the HTTPS_PROXY var in the workload environment
      type: string
      default: ''
    no_proxy:
      description: Domains that need to be excluded from proxying no_proxy="test.com,test.co.uk", it is a comma separate list
      type: string
      default: ''
    log_level:
      description: |
        The verbosity of logs produced by STS.
        Available values are: panic, fatal, error, warn, info, debug, and trace.
      type: string
      default: "info"
    default_auth_provider:
      description: |
        The default authentication provider used when GET /auth/login is called without
        a ?provider= parameter. Valid values are "oidc" and "openid".
        Any other value puts the unit in blocked status.
      type: string
      default: "oidc"
    ubuntu_one_openid_url:
      description: |
        The Ubuntu One OpenID 2.0 endpoint used when the "openid" provider is selected.
      type: string
      default: "https://login.ubuntu.com/+openid"
    ubuntu_one_realm:
      description: |
        The OpenID realm / return_to base URL. It must match the publicly reachable
        base URL of the service (e.g. the ingress hostname), otherwise OpenID
        verification fails. When unset and default_auth_provider is "openid", the
        charm derives the realm from the ingress integration external URL; if no
        realm can be resolved the unit enters blocked status. Not required when
        default_auth_provider is "oidc".
      type: string
      default: ""
    cpu:
      description: |
        K8s cpu resource limit, e.g. "1" or "500m". Default is unset (no limit). This value is used
        for the "limits" portion of the resource requirements (the "requests" portion is
        automatically deduced from it).
        See https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
      type: string
    memory:
      description: |
        K8s memory resource limit, e.g. "1Gi". Default is unset (no limit). This value is used
        for the "limits" portion of the resource requirements (the "requests" portion is
        automatically deduced from it).
        See https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
      type: string

actions:
  run-migration:
    description: |
      Run a migration, this is needed after upgrades. This is a non-reversible operation.
      Run this after backing up the database.
    params:
      timeout:
        description: Timeout after which the migration will be cancelled.
        type: number
        default: 120

########################### build ###########################
base: ubuntu@22.04

platforms:
  amd64:

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
