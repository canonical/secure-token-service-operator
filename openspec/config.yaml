schema: spec-driven

context: |
  This is a Kubernetes-native Charmed Operator (secure-token-service-operator) written in Python 3.12+ using the Ops SDK.
  It manages a Go application binary (secure-token-service) handling secure token exchange, validation, and caching within Canonical's Identity Platform.

  Tech stack: Python Ops SDK, Pebble sidecar container manager, Juju 3.x Secrets, Terraform (for bundle deployment).
  Workload specifications: Exposes gRPC and HTTP ports (e.g., for REST API gateway, token evaluation, and /.well-known/jwks.json checks). Orchestrates database schema migrations via CLI commands prior to workload startup.

  Code conventions & Architectural constraints (mandatory):
  - File headers: Copyright 2026 Canonical Ltd. / See LICENSE file for licensing details.
  - Executable files: Executable Python entrypoints (e.g., `src/charm.py`) must include a proper Python 3 shebang (`#!/usr/bin/env python3`) at the beginning of the file.
  - Centralized Reconciliation: Must implement a centralized logic flow using `_holistic_handler` as the explicit entry point for the reconciliation handler across lifecycle events.
  - Container Execution: The workload binary must be orchestrated through Pebble layers.
  - Limit `event.defer()`: Prefer holistic idempotent reconciliation. Deferral is a last resort.
  - Juju Secrets Protocol: Sensitive data exchange must use Juju 3.x native secrets. Cleartext credentials must never reside directly inside unencrypted relation databags.

  Files & Workspace Structure:
  - charmcraft.yaml: Monolithic configuration manifest defining charm metadata, container primitives, system limits, relation interfaces (pg-database, oauth, receive-ca-cert, ingress, logging, tracing, prometheus, peer), user-facing configs, and juju actions.
  - lib/: Charm libraries providing/consuming interfaces for integrating with other charms.
  - src/charm.py: Orchestrator component. Contains event subscriptions and the main `_holistic_handler` routing loop. Must be kept minimal.
  - src/services.py: Contains `WorkloadService` and `PebbleService` implementations managing container daemon state and workload versions.
  - src/configs.py: Contains `CharmConfig` objects validating charm-specific configuration fields and runtime environments.
  - src/integrations.py: Holds relation wrappers, data transformation mappers, and `EnvVarConvertible` interface implementations.
  - src/secret.py: Dedicated library code for handling Juju native secrets management and decryption lifecycle events.
  - src/cli.py: Wraps `secure-token-service` administrative CLI execution (e.g., `migrate up`) via Pebble exec utilities.
  - src/constants.py: Centralized static string constants, standard integration token names, and exposed infrastructure ports.
  - src/env_vars.py: Defines `DEFAULT_CONTAINER_ENV` maps and houses the structural `EnvVarConvertible` typing protocol.
  - src/exceptions.py: Defines custom, domain-specific exception hierarchies for clear failure isolation (e.g., `MigrationError`).
  - src/utils.py: Houses validation condition factories and specialized predicates (e.g., `is_active_and_idle`, `all_active`).
  - tests/unit/: Table-driven charm unit path tests leveraging the Ops SDK framework and `pytest-mock`.
  - tests/integration/: End-to-end cloud-native jubilant integration testing suite.

  Product language:
  - Write OpenSpec proposals and specs in user-facing product behavior language
  - Requirements should describe the experience, observable behavior, and product contract
  - Put internal mechanisms in design.md or tasks.md unless the mechanism is itself part of the user-facing contract
  - Avoid technical jargon in proposals and specs when possible

rules:
  proposal:
    - Keep proposals concise and strictly under 400 words.
    - Include a "Non-goals" section to clarify what is out of scope for the proposal
    - Include a "Success Metrics" section defining how we will measure the impact of this feature
    - Map every proposed environmental update directly to the workload data provenance table.
  specs:
    - Include a "Purpose" section for each spec to explain the rationale behind the spec
    - Cover happy path, validation errors, and edge cases in the spec
    - Explicitly state any breaking changes or backward compatibility requirements
  design:
    - All design decisions should be justified with trade-offs and alternatives considered
    - Include database schema modifications (e.g., tables, indexes, migrations) explicitly when applicable
    - Include diagrams (Mermaid) or visual aids when describing complex designs
    - Include security, performance, observability, scalability, migration considerations as applicable to the design
  tasks:
    - Break tasks down into distinct, single-event or relation-driven units of work.
    - Every task must be independently completable (no implicit ordering within a group)
    - Each task must explicitly reference the manifest or code file(s) it mutates (e.g., `src/charm.py`, `charmcraft.yaml`).
    - Explicitly list unit, integration, or e2e testing requirements for each task (every relation implementation task must contain a parallel task mapping its corresponding unit/integration test suite requirements).
    - Include a verification suite section
    - Include a documentation & rollout section covering any necessary documentation updates and rollout steps
    - Record deviations from the plan in an "Implementation Notes" section at the end
